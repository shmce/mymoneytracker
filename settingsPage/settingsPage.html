<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyMoney Tracker Settings</title>
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- 2. Load Vue.js (v3) -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>

    <!-- 3. Load Lucide Icons -->
    <script src="https://unpkg.com/lucide-icons"></script>

    <!-- Custom Styles -->
    <link rel="stylesheet" href="settingsPage.css">
</head>
<body class="bg-gray-100">

    <!-- This is the main Vue.js application container -->
    <div id="app" class="flex h-screen">

        <!-- ===== 1. Left Sidebar Navigation ===== -->
        <nav class="w-64 bg-white p-6 shadow-lg flex-shrink-0">
            <!-- Logo -->
            <div class="flex items-center space-x-3 mb-10">
                <div class="logo-container w-200 h-200 flex items-center justify-center rounded-full">
                    <img src="../Images/Logo.svg" alt="MyMoney Tracker Logo" class="w-200 h-200">
                </div>
                <span class="text-xl font-bold text-gray-800">My<span class="text-green-600">Money</span> Tracker</span>
            </div>

            <!-- Navigation Links -->
            <ul class="space-y-3">
                <li v-for="item in navItems" :key="item.name">
                    <a @click.prevent="setActiveNav(item.name)"
                       :class="[
                           'flex items-center space-x-3 p-3 rounded-lg cursor-pointer transition-all',
                           activeNav === item.name
                               ? 'bg-green-100 text-green-700 font-semibold'
                               : 'text-gray-500 hover:bg-gray-100 hover:text-gray-800'
                       ]">
                        <i :data-lucide="item.icon" class="w-5 h-5"></i>
                        <span>{{ item.name }}</span>
                    </a>
                </li>
            </ul>
        </nav>

        <!-- ===== 2. Main Content Area ===== -->
        <main class="flex-1 p-8 overflow-y-auto">
            <!-- Settings Form -->
            <div class="bg-white p-6 rounded-lg shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-semibold text-gray-800">Profile Settings</h2>
                    <button @click="toggleEdit" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 transition">{{ isEditing ? 'Save' : 'Edit' }}</button>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                        <input type="text" v-model="form.fullName" :disabled="!isEditing" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Your Full Name" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Nickname</label>
                        <input type="text" v-model="form.nickname" :disabled="!isEditing" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500" placeholder="Nickname" />
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-2">Gender</label>
                        <select v-model="form.gender" :disabled="!isEditing" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                            <option value="">Pick a Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium text-gray-700 mb-2">Date of Birth</label>
                        <div class="grid grid-cols-3 gap-4">
                            <select v-model="form.dob.month" :disabled="!isEditing" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                                <option value="">Month</option>
                                <!-- Add month options -->
                            </select>
                            <select v-model="form.dob.day" :disabled="!isEditing" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                                <option value="">Day</option>
                                <!-- Add day options -->
                            </select>
                            <select v-model="form.dob.year" :disabled="!isEditing" class="px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-green-500">
                                <option value="">Year</option>
                                <!-- Add year options -->
                            </select>
                        </div>
                    </div>
                </div>

                <div class="mb-6">
                    <label class="block text-sm font-medium text-gray-700 mb-2">My Email Addresses</label>
                    <div v-for="email in profile.emails" :key="email.address" class="flex items-center justify-between bg-gray-50 p-3 rounded-lg mb-2">
                        <div class="flex items-center">
                            <i data-lucide="mail" class="w-5 h-5 text-green-600 mr-3"></i>
                            <span class="text-gray-800">{{ email.address }}</span>
                        </div>
                        <span class="text-sm text-gray-500">{{ email.lastUpdated }}</span>
                    </div>
                </div>

                <div class="flex justify-center">
                    <button id="logoutBtn" class="bg-red-600 text-white px-6 py-2 rounded-lg hover:bg-red-700 transition">Logout</button>
                </div>
                <!-- Logout Confirmation Modal -->
                <div id="logoutModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black bg-opacity-40">
                    <div class="bg-white rounded-lg w-full max-w-sm p-6 shadow-lg">
                        <h3 class="text-lg font-semibold mb-2">Confirm Logout</h3>
                        <p class="text-sm text-gray-700 mb-4">Are you sure you want to log out?</p>
                        <div class="flex justify-end gap-2 mt-4">
                            <button id="cancelLogout" class="px-4 py-2 rounded bg-gray-100">Cancel</button>
                            <button id="confirmLogout" class="px-4 py-2 rounded bg-red-600 text-white">Logout</button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <!-- ===== 3. Right Sidebar (My Card) ===== -->
        <aside class="w-65 bg-white p-8 shadow-lg flex-shrink-0 hidden lg:block">
           <div class="flex justify-between items-center mb-3">
                <h2 class="text-xl font-semibold text-gray-800">My Accounts</h2>
            </div>
            <div class="flex justify-between items-center mb-4">
                <button @click="openAddAccount" class="text-sm text-green-600 font-medium hover:text-green-700 transition">+ Add Accounts</button>
            </div>


            <div class="space-y-4">
                <div v-for="account in accounts" :key="account.platformNumber" class="p-5 border border-gray-100 rounded-xl hover:shadow-md transition-shadow">
                    <div class="flex justify-between items-start mb-2">
                        <span class="font-bold text-gray-800">{{ account.platform }}</span>
                        <i data-lucide="wallet" class="w-5 h-5 text-gray-400"></i>
                    </div>
                    <div class="flex justify-between items-end">
                        <div>
                            <span class="text-xs text-gray-400 block">Balance</span>
                            <span class="text-lg font-bold text-green-600"> {{ formatCurrency(account.availableAssets) }}</span>
                        </div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Add Account Modal (inside #app so Vue can bind) -->
        <div v-cloak v-if="showAddAccount" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-40">
            <div class="bg-white rounded-lg w-full max-w-md p-6 shadow-lg">
                <h3 class="text-lg font-semibold mb-4">Add New Account</h3>

                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-gray-600">Account Name</label>
                        <input v-model="newAccount.platform" type="text" class="w-full mt-1 p-2 border rounded" />
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600">Account Type</label>
                        <select v-model="newAccount.accountType" class="w-full mt-1 p-2 border rounded">
                            <option value="">Select type</option>
                            <option>Cash</option>
                            <option>Bank</option>
                            <option>e-Wallet</option>
                            <option>Credit</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-sm text-gray-600">Initial Assets</label>
                        <input v-model.number="newAccount.availableAssets" type="number" step="0.01" class="w-full no-spin mt-1 p-2 border rounded" />
                    </div>
                </div>

                <div class="flex justify-end gap-2 mt-6">
                    <button @click="closeAddAccount" class="px-4 py-2 rounded bg-gray-100">Cancel</button>
                    <button @click="saveNewAccount" class="px-4 py-2 rounded bg-green-600 text-white">Save</button>
                </div>
            </div>
        </div>

    </div>

    <!-- ===== Vue.js Application Script ===== -->
    <script src="settingsPage.js"></script>
    <!-- Inline script to control logout modal and redirect -->
    <script>
document.addEventListener('DOMContentLoaded', () => {
    const logoutBtn = document.getElementById('logoutBtn');
    const modal = document.getElementById('logoutModal');
    const cancel = document.getElementById('cancelLogout');
    const confirm = document.getElementById('confirmLogout');
    if (!logoutBtn || !modal) return;

    logoutBtn.addEventListener('click', () => modal.classList.remove('hidden'));
    cancel.addEventListener('click', () => modal.classList.add('hidden'));
    // close modal when clicking backdrop
    modal.addEventListener('click', (e) => { if (e.target === modal) modal.classList.add('hidden'); });
    // redirect to login page on confirm
    confirm.addEventListener('click', () => {
        window.location.href = '../loginPage/Login.html';
    });
});
</script>

</body>
</html>
